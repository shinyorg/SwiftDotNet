# The Rider the plugin builds and runs against. The JetBrains repository publishes this as 2026.2,
# which is build RD-262.* — the build the findings in plans/rider-plugin-plan.md §2 were verified
# against, and what `/Applications/Rider.app` reports. Note 2026.1 in that repository is RD-261.
riderVersion=2026.2

pluginVersion=0.1.0

# See plans/rider-plugin-plan.md §2.4 — the Rider run/debug classes we build on are internal, so the
# supported range is deliberately narrow and re-verified per release rather than left open-ended.
pluginSinceBuild=262
pluginUntilBuild=262.*

org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
org.gradle.caching=true
org.gradle.configuration-cache=false
kotlin.stdlib.default.dependency=false
